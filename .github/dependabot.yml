version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
      - /examples/interop
      - /examples/blog
      - /tests/types-compat
      - /bench
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
