version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
      - /examples/interop
      - /examples/blog
      - /tests/types-compat
      - /bench
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # monaco-editor is 0.x and removed the entry points the playground imports
      # (editor.all, basic-languages) in 0.53+; bump it by hand with the playground.
      - dependency-name: monaco-editor
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
