name: Feature request
description: Suggest a new feature or a change to the API
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@afora/core"
        - "@afora/codegen"
        - "@afora/mcp"
        - "@afora/hono"
        - "@afora/fastify"
        - "@afora/express"
        - "@afora/elysia"
        - "@afora/drizzle"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How it would be used, in code.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other designs considered, and what you do today instead.
