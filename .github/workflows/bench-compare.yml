name: Benchmark against the base

# A file of its own, not a job of ci.yml: it writes a comment on the pull
# request, and ci.yml is also called by the release, whose token cannot.
on:
  pull_request:
  # CodSpeed needs the runs of the base branches to compare a pull request with
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: bench-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-compare:
    name: Validation speed against the base (${{ matrix.label }})
    # Runs the code of the pull request, so its token only reads; the comment is
    # written by the job below, from the uploaded reports. Linux x64 and macOS
    # ARM64 are timed apart: the cost of an engine on one is not that on the
    # other (what #158 gained on an M2 it did not gain on Linux).
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, key: linux, label: Linux x64 }
          - { os: macos-latest, key: macos, label: macOS ARM64 }
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: bench
      # afora of the base and of this branch, taking turns in one process; fails when blueprint.safeParse is over 1.1x its base (COMPARE_LIMIT in bench/compare.ts)
      - run: bun run.ts --compare ../.base
        working-directory: bench
        env:
          BENCH_COMPARE_OUT: ${{ runner.temp }}/compare.md
      - name: Show the comparison in the summary
        id: report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compare.md" ]; then
            { echo "#### ${{ matrix.label }}"; echo; cat "$RUNNER_TEMP/compare.md"; echo; } > "$RUNNER_TEMP/report-${{ matrix.key }}.md"
            cat "$RUNNER_TEMP/report-${{ matrix.key }}.md" >> "$GITHUB_STEP_SUMMARY"
            echo "report=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.report.outputs.report == 'true'
        with:
          name: report-${{ matrix.key }}
          path: ${{ runner.temp }}/report-${{ matrix.key }}.md
          retention-days: 7
          overwrite: true

  comment:
    name: Comment the comparison
    # Runs no code of the pull request: it only posts the reports of the jobs
    # above, also when a comparison failed. A pull request from a fork has a
    # read-only token: it gets the summary alone.
    needs: bench-compare
    if: always() && needs.bench-compare.outputs.report == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ runner.temp }}/compare
      - name: Comment on the pull request
        run: |
          cat "$RUNNER_TEMP"/compare/report-*.md > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment.md" || echo "::warning::could not comment on the pull request"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  codspeed:
    name: CodSpeed
    # off until the CodSpeed app is installed on the repository: set the repository variable CODSPEED_ENABLED to "true"
    if: vars.CODSPEED_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: bench
      # the benchmark runs on Node, against a build of afora
      - run: bun build ../src/index.ts --outfile .dist/afora.js --target node --format esm --packages external
        working-directory: bench
      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          working-directory: bench
          run: node codspeed.ts
