name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow keeps the CI called by a release out of the group of the push to main
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, Knip and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run typecheck
      - run: bun run --cwd packages/codegen typecheck
      - run: bun run --cwd packages/mcp typecheck
      - run: bun run --cwd packages/hono typecheck
      - run: bun run --cwd packages/ws typecheck
      - run: bun run --cwd packages/drizzle typecheck
      - run: bun run --cwd packages/dynamodb typecheck

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run test:interop
      - run: bun run test:blog
      - run: bun run test:agent-built
      - run: bun run docs:links

  bench:
    name: Validation speed against Zod 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # the benchmark runs afora from src, which imports typebox and slugify from the root install
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: bench
      # fails when blueprint.safeParse is over the limit of a case against Zod 4 safeParse (bench/guard.limits.ts)
      - run: bun run bench:guard

  api-surface:
    name: Public API surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:api

  packages:
    name: Packages (codegen, mcp, hono, ws, drizzle, dynamodb)
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # the packages build against the declarations of the built core
      - run: bun run build
      - run: bun run test:codegen
      - run: bun run test:roundtrip
      - run: bun run test:mcp
      - run: bun run test:hono
      - run: bun run test:ws
      - run: bun run test:drizzle
      - run: bun run test:dynamodb
      - run: bun run --cwd packages/codegen build
      - run: bun run --cwd packages/mcp build
      - run: bun run --cwd packages/hono build
      - run: bun run --cwd packages/ws build
      - run: bun run --cwd packages/drizzle build
      - run: bun run --cwd packages/dynamodb build

  build:
    name: Build and smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run smoke
      - run: bun run test:types
        if: matrix.node == 24
