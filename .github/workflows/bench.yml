name: Benchmark results

# Runs the whole benchmark (bench/) on a GitHub runner and opens a pull request
# with bench/results/, bench/RESULTS.md and the block of the README. Run it by
# hand (or by pushing a bench-results/ branch, see below), or let a release call
# it once the packages are published.
on:
  workflow_dispatch:
  workflow_call:
  # `workflow_dispatch` only exists once this file is on the default branch.
  # Pushing a branch named bench-results/<anything> measures that commit:
  # `git push origin dev:bench-results/now`. The branch is deleted at the end.
  push:
    branches: ["bench-results/**"]

permissions:
  contents: read

concurrency:
  group: bench-results
  cancel-in-progress: false

jobs:
  results:
    name: Measure and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # the Node leg of the benchmark, and the cold start on Node
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: bench
      # writes bench/results/latest.json and history/<version>.json, RESULTS.md, the chart and the block of README.md
      - run: bun run.ts
        working-directory: bench
        env:
          BENCH_QUIET: "1"
          BENCH_HISTORY: "1"
      - name: Open a pull request with the results
        run: |
          if git diff --quiet -- bench README.md; then
            echo "The results did not change."
            exit 0
          fi
          version="$(node -p 'require("./package.json").version')"
          branch="bench/results-$version-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add bench/results bench/RESULTS.md README.md
          git commit -m "docs(bench): results of $version on the GitHub runner"
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "docs(bench): results of $version on the GitHub runner" \
            --body "Generated by the \`Benchmark results\` workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)) on \`ubuntu-latest\`, a shared machine: read the ratios and the margins, not the absolute times. The prose of the Performance section in the README is written by hand; check it against the new table." \
            || echo "::warning::The results are on the branch $branch, but this token may not open a pull request (Settings > Actions > General > Allow GitHub Actions to create and approve pull requests). Open it with: gh pr create --base dev --head $branch --fill"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Delete the branch that asked for this run
        if: always() && github.event_name == 'push'
        run: git push origin --delete "$GITHUB_REF_NAME"
