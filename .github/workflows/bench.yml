name: Benchmark results

# Runs the whole benchmark (bench/) on a GitHub runner and opens a pull request
# with bench/results/, bench/RESULTS.md and the block of the README. Run it by
# hand (or by pushing a bench-results/ branch, see below), or let a release call
# it once the packages are published.
on:
  workflow_dispatch:
  workflow_call:
  # `workflow_dispatch` only exists once this file is on the default branch.
  # Pushing a branch named bench-results/<anything> measures that commit:
  # `git push origin dev:bench-results/now`. The branch is deleted at the end.
  push:
    branches: ["bench-results/**"]

permissions:
  contents: read

concurrency:
  group: bench-results
  cancel-in-progress: false

jobs:
  results:
    name: Measure
    # Installs the dependencies and runs the benchmark with a token that only
    # reads; the job below commits the generated files.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # a Node leg of the benchmark, and the cold start, for each Node in BENCH_NODE_BINS.
      # Each setup-node puts its Node first on the PATH, so its path is kept right after it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: echo "NODE_22_BIN=$(which node)" >> "$GITHUB_ENV"
      # the last one stays on the PATH, for the steps below that call `node`
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: echo "NODE_24_BIN=$(which node)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: bench
      # writes bench/results/latest.json and history/<version>.json, RESULTS.md, the chart and the block of README.md
      - run: bun run.ts
        working-directory: bench
        env:
          BENCH_QUIET: "1"
          BENCH_HISTORY: "1"
          BENCH_NODE_BINS: ${{ env.NODE_22_BIN }}:${{ env.NODE_24_BIN }}
      - id: diff
        name: Did the results change
        run: |
          if git diff --quiet -- bench README.md; then
            echo "The results did not change."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: bench-results
          # the root of the repository is their common ancestor, so the paths are kept
          path: |
            bench/results
            bench/RESULTS.md
            README.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  pull-request:
    name: Open a pull request
    # Runs no code of the repository: it commits the files of the job above and
    # pushes them with the token given to that step alone.
    needs: results
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.results.result == 'success' && needs.results.outputs.changed == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.results.result == 'success' && needs.results.outputs.changed == 'true'
        with:
          name: bench-results
          path: .
      - name: Open a pull request with the results
        if: needs.results.result == 'success' && needs.results.outputs.changed == 'true'
        run: |
          version="$(node -p 'require("./package.json").version')"
          branch="bench/results-$version-$GITHUB_RUN_ID"
          remote="https://x-access-token:$GH_TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add bench/results bench/RESULTS.md README.md
          git commit -m "docs(bench): results of $version on the GitHub runner"
          git push -q "$remote" "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" \
            --title "docs(bench): results of $version on the GitHub runner" \
            --body "Generated by the \`Benchmark results\` workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)) on \`ubuntu-latest\`, a shared machine: read the ratios and the margins, not the absolute times. The prose of the Performance section in the README is written by hand; check it against the new table." \
            || echo "::warning::The results are on the branch $branch, but this token may not open a pull request (Settings > Actions > General > Allow GitHub Actions to create and approve pull requests). Open it with: gh pr create --base dev --head $branch --fill"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Delete the branch that asked for this run
        # When a release calls this workflow, github.event_name is the caller's
        # ("push" to main), so the event alone would try to delete main.
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/bench-results/')
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
