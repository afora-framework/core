name: Release

# Publishes the channels of VERSIONING.md. scripts/release-channel.ts decides
# what a run does, and scripts/release-channel.test.ts covers it:
#
# - main: the version of package.json, when it has no tag yet, to latest
#   (stable), rc or beta. Bump it in a release pull request with
#   `bun run release:version <v>`.
# - release/<YY>.<minor>: the patches (<YY>.<minor>.<p>, p >= 1, or their rc)
#   of that line; to latest, or to the dist-tag release-<YY>.<minor> for an rc
#   or a version behind latest.
# - dev: the Next, <base>-alpha.<run number>, to the next dist-tag, on every push
#   that changes src/, packages/*/src/ or package.json. The version is written
#   before the build and never committed; no git tag and no GitHub release.
#
# Every publish runs from this file and the environment npm: they are what npm
# trusts (trusted publishing, OIDC).
on:
  push:
    branches: [main, "release/**", dev]
    # One list for every branch: on dev, the detect job also checks that the push
    # changed src/, packages/*/src/ or package.json, so a dependency bump of a
    # package alone publishes no Next.
    paths:
      - package.json
      - packages/*/package.json
      - src/**
      - packages/*/src/**
  # re-runs a release that failed halfway, or shows the decision with dry-run
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only print what would be published
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # one release at a time per branch: the Next of dev never waits for a release of main
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect the version and the channel
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.channel.outputs.publish }}
      version: ${{ steps.channel.outputs.version }}
      dist-tag: ${{ steps.channel.outputs.dist-tag }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      make-latest: ${{ steps.channel.outputs.make-latest }}
      git-release: ${{ steps.channel.outputs.git-release }}
      bench: ${{ steps.channel.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the repository is public: git ls-remote and git fetch of the detect need no credentials
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          # no cache in a release: a cache written by another workflow must not reach what is published
          no-cache: true
      - id: channel
        name: Compare package.json with the branch, the tags and npm
        # Fails when the version is outside the scheme or the line of the branch,
        # when a package is at another version or has a peer range on
        # @afora/core that does not accept it, when it would move its dist-tag
        # backwards, or when npm cannot be read (only E404 means no tags).
        run: bun scripts/release-channel.ts detect
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
      - name: Dry run
        if: inputs.dry-run
        run: echo "::notice::dry run, nothing is published"

  ci:
    needs: detect
    if: needs.detect.outputs.publish == 'true' && !inputs.dry-run
    uses: $/.github/workflows/ci.yml

  build:
    name: Build and pack the packages
    # Builds and packs every package without any write scope and without the OIDC
    # token: the dependencies, the build and the checks of prepublishOnly run here,
    # and only the tarballs go on to the job that publishes.
    needs: [detect, ci]
    if: needs.detect.outputs.publish == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      PRERELEASE: ${{ needs.detect.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          # no cache in a release: a cache written by another workflow must not reach what is published
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Write the version of the Next
        # in every package.json, peers included, for this run only: never committed
        if: github.ref == 'refs/heads/dev'
        run: bun scripts/release-channel.ts set-version "$VERSION"
      - name: Checks of prepublishOnly
        # npm publish ran the prepublishOnly of the core (typecheck, tests, smoke);
        # the publish job runs no script (--ignore-scripts), so they run here
        run: bun run typecheck && bun test && bun run smoke
      - run: bun run build:packages
      - name: Pack
        # core first, then the packages that depend on it: publish reads the
        # order from packages.txt (one "<name> <tarball>" per line).
        run: |
          # npm does not rewrite the workspace: protocol, so pin the real version:
          # a range for a stable version, the exact one for a prerelease, which
          # may break from one to the next.
          if [ "$PRERELEASE" = "true" ]; then
            pin="$VERSION"
          else
            pin="^$VERSION"
          fi
          (cd packages/mcp && npm pkg set "dependencies.@afora/codegen=$pin")

          out="$RUNNER_TEMP/packages"
          mkdir -p "$out"
          : > "$out/packages.txt"
          for dir in . packages/codegen packages/mcp packages/hono packages/fastify packages/express packages/elysia packages/ws packages/drizzle packages/dynamodb packages/otel; do
            name="$(node -p "require('./$dir/package.json').name")"
            file="$(cd "$dir" && npm pack --ignore-scripts --pack-destination "$out" | tail -n 1)"
            echo "$name $file" >> "$out/packages.txt"
          done
          cat "$out/packages.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 7
          # a re-run of this job replaces the tarballs of the previous attempt
          overwrite: true

  publish:
    name: Publish to npm
    # The only job with the OIDC token. It checks out nothing, installs nothing and
    # runs no script of the packages: it publishes the tarballs of build.
    needs: [detect, build]
    if: needs.detect.outputs.publish == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      DIST_TAG: ${{ needs.detect.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Publish
        # In the order of packages.txt: core first, then the packages that depend
        # on it. A version that is already on npm is skipped, so a run can be
        # repeated after a partial failure.
        # Publishing uses trusted publishing (OIDC) only. No token is passed on
        # purpose: with one, npm falls back to it without a word when OIDC fails,
        # the package goes out without provenance and its trusted publisher is
        # never validated. A package that is not on npm yet is published once by
        # hand with scripts/release-setup.sh, since npm cannot create one through OIDC.
        working-directory: ${{ runner.temp }}/packages
        run: |
          while read -r name file; do
            [ -n "$name" ] || continue
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm, skipping"
              continue
            fi
            npm publish "./$file" --tag "$DIST_TAG" --provenance --ignore-scripts
          done < packages.txt

  release:
    name: Tag and GitHub release
    # not for the Next (alpha); beta and rc are prereleases, and a patch of
    # an older line than latest is not marked as the latest release
    needs: [detect, publish]
    if: needs.detect.outputs.git-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag and the GitHub release
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            mark="--prerelease"
          else
            mark="--latest=$MAKE_LATEST"
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes "$mark"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.detect.outputs.make-latest }}

  bench:
    name: Benchmark results of the release
    # stable and rc only
    needs: [detect, publish]
    if: needs.detect.outputs.bench == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/bench.yml

  site-values:
    name: Version on the website (afora CMS)
    # Only a release that npm now serves as latest (a stable on main, or a
    # patch of the newest line), once its tag and GitHub release exist: it sets
    # coreVersion in afora CMS's site-values entry, and publishing it rebuilds
    # getafora.com. It checks out nothing and runs no code of the repository.
    # CMS_TOKEN is an API token of afora CMS limited to the site-values type
    # (Tokens de API, "Limitar a tipos de conteúdo"); CMS_API_URL is the CMS's
    # origin, without /admin/v1. Without the token the job only warns.
    needs: [detect, publish, release]
    if: needs.detect.outputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Set coreVersion in site-values
        # data replaces every field of the entry: read it, change coreVersion,
        # send it all back. The entry stays published. Repeating it is harmless.
        run: |
          set -euo pipefail
          if [ -z "$CMS_TOKEN" ] || [ -z "$CMS_API_URL" ]; then
            echo "::warning::CMS_TOKEN or CMS_API_URL is not set: the website keeps its version until it is set"
            exit 0
          fi
          entry="${CMS_API_URL%/}/admin/v1/entries/site-values"
          auth="Authorization: Bearer $CMS_TOKEN"
          body=$(curl --fail-with-body -sS --retry 3 -H "$auth" "$entry" \
            | jq -c --arg v "$VERSION" '{data: (.data + {coreVersion: $v})}')
          curl --fail-with-body -sS --retry 3 -X PATCH -H "$auth" \
            -H 'Content-Type: application/json' -d "$body" "$entry" \
            | jq '{slug, status, data}'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
          CMS_API_URL: ${{ vars.CMS_API_URL }}
