name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun run build:packages
      - name: Publish
        # core first, then the packages that depend on it. A version that is
        # already on npm is skipped, so a tag can be re-run after a partial failure.
        run: |
          publish() {
            dir="$1"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
              return
            fi
            case "$version" in
              *-*) tag=next ;;
              *) tag=latest ;;
            esac
            (cd "$dir" && npm publish --tag "$tag")
          }

          # npm does not rewrite the workspace: protocol, so pin the real version.
          codegen_version="$(node -p 'require("./packages/codegen/package.json").version')"
          (cd packages/mcp && npm pkg set "dependencies.@afora/codegen=^$codegen_version")

          publish .
          publish packages/codegen
          publish packages/mcp
          publish packages/hono
          publish packages/drizzle
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
