name: Release

# Publishes when the version in package.json has no tag yet. Bump the version in
# a pull request; merging it to main runs CI, publishes and creates the tag.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - packages/*/package.json
  # re-runs a release that failed halfway
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect a new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: version
        name: Compare package.json with the tags and npm
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The scheme of VERSIONING.md: 0.0.<n> before 27.0, then <YY>.<minor>.<patch>
          # with an optional -rc.<n>, where YY (the year of the cycle) is 27 or more.
          if ! printf '%s' "$version" | grep -Eq '^(0\.0\.(0|[1-9][0-9]*)|(2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?)$'; then
            echo "::error::$version is not in the scheme of VERSIONING.md: 0.0.<n>, or <YY>.<minor>.<patch>[-rc.<n>] with YY >= 27"
            exit 1
          fi

          # The tag is created last, so a missing tag also means an unfinished release.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # All the packages are released together, under one version and one tag.
          for dir in packages/*/; do
            other="$(node -p "require('./${dir}package.json').version")"
            if [ "$other" != "$version" ]; then
              echo "::error::$dir is at $other, but package.json is at $version"
              exit 1
            fi
          done

          # Never move the latest dist-tag backwards.
          latest="$(npm view @afora/core version)"
          if [ "$(bun -e "console.log(Bun.semver.order('$version', '$latest'))")" = "-1" ]; then
            echo "::error::package.json is at $version, behind $latest on npm"
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

  ci:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [detect, ci]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Publish
        # core first, then the packages that depend on it. A version that is
        # already on npm is skipped, so a run can be repeated after a partial failure.
        # Publishing uses trusted publishing (OIDC) only. No token is passed on
        # purpose: with one, npm falls back to it without a word when OIDC fails,
        # the package goes out without provenance and its trusted publisher is
        # never validated. A package that is not on npm yet is published once by
        # hand with scripts/release-setup.sh, since npm cannot create one through OIDC.
        run: |
          publish() {
            dir="$1"
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm, skipping"
              return
            fi
            case "$VERSION" in
              *-*) tag=next ;;
              *) tag=latest ;;
            esac
            (cd "$dir" && npm publish --tag "$tag")
          }

          # npm does not rewrite the workspace: protocol, so pin the real version.
          (cd packages/mcp && npm pkg set "dependencies.@afora/codegen=^$VERSION")

          publish .
          publish packages/codegen
          publish packages/mcp
          publish packages/hono
          publish packages/fastify
          publish packages/express
          publish packages/elysia
          publish packages/ws
          publish packages/drizzle
          publish packages/dynamodb
          publish packages/otel
      - name: Create the tag and the GitHub release
        run: |
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}

  bench:
    name: Benchmark results of the release
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/bench.yml
