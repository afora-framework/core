<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">Validations per second: API request body (an order with 5 items), valid input</title>
<desc id="desc">Typia: 2.05M per second; TypeBox: 1.56M per second; Ajv: 1.28M per second; afora: 404.4k per second; Zod: 322.8k per second; Valibot: 297.2k per second; Effect Schema: 206.7k per second; Joi: 82.9k per second; ArkType: 41.9k per second; Yup: 20.7k per second.</desc>
<style>
	.title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
	.subtitle, .foot { font-size: 12px; fill: #52514e; }
	.name { font-size: 13px; fill: #52514e; }
	.name.strong { font-weight: 600; fill: #0b0b0b; }
	.value { font-size: 12px; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
	.muted { fill: #52514e; }
	.bar { fill: #a3a29c; }
	.bar.accent { fill: #2a78d6; }
	.axis { stroke: #a3a29c; stroke-width: 1; }
	@media (prefers-color-scheme: dark) {
		.title, .name.strong, .value { fill: #f0efec; }
		.subtitle, .foot, .name, .muted { fill: #c3c2b7; }
		.bar { fill: #6b6a65; }
		.bar.accent { fill: #3987e5; }
		.axis { stroke: #6b6a65; }
	}
</style>
