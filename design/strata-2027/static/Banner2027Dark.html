/* ============================================================

.st {

  --m1: #F0B85A; --m2: #F5965F; --m3: #FF6B3D; --m4: #C64B2B; --m5: #5F9471; --m6: #2E6A69; --m7: #0B1312;
  --m1-hi: #FFD68A; --m2-hi: #FFB585; --m3-hi: #FF9268; --m4-hi: #C0442A; --m5-hi: #86BC95; --m6-hi: #357573;

.st .slab { --gap: 54px; --z: calc(var(--i) * var(--gap)); position: absolute; left: calc(var(--w) * -1.7px); top: -46px; width: calc(var(--w) * 3.4px); height: 92px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; border-radius: 999px;
  transform-style: preserve-3d; transform: translateZ(var(--z)); transition: transform .55s cubic-bezier(.22,1,.36,1), filter .3s;

.st .env-plate { position: absolute; left: -230px; top: -150px; width: 460px; height: 300px; border-radius: 80px; transform: translateZ(-40px); border: 2px dashed color-mix(in oklab, var(--ink) 40%, transparent);

.st .twin { margin-top: 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "sh rh" "sb rb" "sb tr" "sm sm"; grid-template-rows: auto auto 1fr auto; border: 0; border-radius: 28px;
  background-image: var(--grain), linear-gradient(160deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 88%, var(--m2)) 100%); background-size: 220px 220px, 100% 100%; background-blend-mode: overlay, normal; box-shadow: var(--lift); }

.st .out { background: linear-gradient(180deg, color-mix(in oklab, var(--m5) 9%, transparent), color-mix(in oklab, var(--m5) 4%, transparent)); }

.st .sed-band { position: relative; height: 150px; overflow: hidden; background: linear-gradient(to bottom, transparent 75%, var(--m7) 75%); }
.st .sed-band .sed { position: absolute; inset: -14px 0 0 0; width: 100%; height: calc(100% + 14px); }

.st .bar-row:nth-child(4) .layer { --hi: var(--m4-hi); --lo: var(--m4); }

.st .layer[aria-pressed="true"] span { opacity: .85; }
.st .layer.env { background: transparent; color: var(--ink); border: 1.5px dashed var(--line-strong); box-shadow: none; }
.st .layer.env[aria-pressed="true"] { background-image: var(--grain), linear-gradient(110deg, var(--m3-hi), var(--m4)); border-color: transparent; color: #fff; }
.st .detail { --lc: var(--m4); border: 0; background-image: var(--grain), radial-gradient(120% 90% at 0% 0%, color-mix(in oklab, var(--lc) 30%, transparent), transparent 60%), linear-gradient(var(--surface), var(--surface)); background-size: 220px, 100%, 100%; background-blend-mode: overlay, normal, normal; box-shadow: var(--lift); }
.st .seed .detail { --lc: inherit; }

.st .report { border: 0; background-image: var(--grain), linear-gradient(180deg, var(--surface), color-mix(in oklab, var(--surface) 92%, var(--m5))); background-size: 220px, 100%; background-blend-mode: overlay, normal; box-shadow: var(--lift); }
.st .report-head { background-image: linear-gradient(90deg, color-mix(in oklab, var(--m5) 22%, var(--sunken)), var(--sunken) 60%); border-bottom: 0; }

.st .io > div { border: 0; background: color-mix(in oklab, var(--bg) 80%, transparent); box-shadow: 0 0 0 1px var(--line) inset; }
.st .pass i { background: linear-gradient(140deg, var(--m5-hi), var(--m6)); color: #fff; }

/* ---------- circuit ---------- */

.st .tabs-nav a:hover:not([aria-current="page"]) { background: var(--sunken); color: var(--ink); }
.st #model, .st #journal { position: relative; }
.st .station { position: absolute; z-index: 2; left: 32px; top: 0; bottom: 0; width: 40px; pointer-events: none; }
.st .station::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--sc) 0%, var(--sc2) 100%); opacity: .75; }
.st #model .station::before { top: 112px; }
.st #journal .station::before { bottom: 72px; background: linear-gradient(180deg, var(--sc), transparent); }
.st .station b { position: absolute; top: 112px; left: 0; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; pointer-events: auto;
  background-image: var(--grain), linear-gradient(140deg, color-mix(in oklab, var(--sc) 70%, #fff), var(--sc)); background-size: 220px, 100%; background-blend-mode: overlay, normal;
  box-shadow: 0 0 0 5px var(--bg), 0 10px 24px -10px var(--sc); color: #131512; font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 12px; font-weight: 700; transition: transform .25s cubic-bezier(.22,1,.36,1); }
.st #connect .station b { box-shadow: 0 0 0 5px var(--m7), 0 10px 24px -10px var(--sc); }
.st #rules .station b, .st #journal .station b { color: #fff; }
.st .station span { position: absolute; top: 166px; left: 28px; writing-mode: vertical-rl; pointer-events: auto; font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.st .station:hover b { transform: scale(1.12); }
.st .station:hover span { color: var(--ink); }
@media (max-width: 800px) { .st .tabs-nav, .st .station { display: none; } }


body { margin: 0; }
.st.cover { position: relative; overflow: hidden; box-sizing: border-box; font-family: var(--sans); color: var(--ink); background: var(--bg); }
.st.cover::before, .st.cover .glow2 { content: ""; position: absolute; z-index: 0; pointer-events: none; border-radius: 50%; filter: blur(56px); }
.st.cover::before { right: -14%; top: -30%; width: 74%; height: 120%;
  background: radial-gradient(40% 46% at 58% 38%, var(--glow-2), transparent 70%), radial-gradient(36% 42% at 38% 62%, var(--glow-1), transparent 72%), radial-gradient(30% 36% at 80% 74%, var(--glow-4), transparent 72%); }
.st.cover .glow2 { left: -18%; bottom: -50%; width: 60%; height: 100%; background: radial-gradient(40% 44% at 50% 40%, var(--glow-3), transparent 72%); }
.st.cover > .cv { position: relative; z-index: 1; height: 100%; box-sizing: border-box; }
.st .lock { display: flex; align-items: center; gap: 2px; }
.st .lock img { display: block; }
.st .lock b { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
.st .cv-eyebrow { font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.st .cv-h1 { margin: 0; font-weight: 660; letter-spacing: -.045em; line-height: .98; }
.st .cv-h1 em { font-style: oblique 12deg; font-variation-settings: "CASL" 1, "slnt" -12; font-weight: 600; background: linear-gradient(100deg, var(--m5) 0%, var(--m6) 55%, var(--m4) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .08em; }
.st[data-theme="dark"] .cv-h1 em { background-image: linear-gradient(100deg, var(--m5-hi) 0%, var(--m1) 60%, var(--m3) 100%); }
.st .cv-lead { margin: 0; color: var(--muted); }
.st .cv-pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px; border-radius: 999px; font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 17px; font-weight: 600; color: var(--on-ink);
  background: linear-gradient(180deg, color-mix(in oklab, var(--ink) 82%, var(--m4)) 0%, var(--ink) 100%); box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 14px 30px -14px rgba(19,21,18,.6); }
.st[data-theme="dark"] .cv-pill { background: linear-gradient(180deg, #FFFFFF 0%, var(--ink) 100%); color: #131512; box-shadow: 0 14px 30px -14px var(--glow-1); }
.st .cv-pill i { font-style: normal; opacity: .55; }
.st .cv-meta { white-space: nowrap; display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 14px; color: var(--muted); }
.st .cv-meta .dotsep { width: 5px; height: 5px; border-radius: 50%; background: var(--m3); }
.st .cover-stack { position: absolute; margin: 0; perspective: 1600px; }
.st .cover-stack .rig { animation: none; }
.st .cover-stack .slab { --gap: 58px; }
.st .cover-stack .env-plate { opacity: .7; }
.st .cover-stack .slab.on { transform: translateZ(calc(var(--z) + 14px)); }
.st .sed-foot { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; }
.st .sed-foot .sed { position: absolute; inset: -12px 0 0 0; width: 100%; height: calc(100% + 12px); }
.st .sed-foot::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); background-size: 220px; mix-blend-mode: overlay; opacity: .9; }

/* GitHub social preview 1280x640 */
